name: CI / Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js Syntax & App Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Validate Backend Syntax
        run: |
          cd cafeteria_backend-master
          node --check app.js
          node --check scripts.js

  ci-success:
    name: CI Test Suite Pass
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Gate Check
        run: echo "Cafeteria app syntax validation passed."
